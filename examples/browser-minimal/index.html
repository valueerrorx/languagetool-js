<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LT-JS im Browser</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 8rem; font: inherit; }
    li { margin: .4rem 0; }
    code { background: #eee; padding: 0 .2rem; }
    #status { color: #666; }
  </style>
</head>
<body>
  <h1>LT-JS im Browser (ohne Node)</h1>
  <p id="status">Lade Sprachdaten …</p>
  <textarea id="text">Ich glaube, das es morgen regnen wird. Wir haben uns sehr über das Geschenk gefreut wo du mitgebracht hast. Er ist gestern nach Hause gegangen weil er müde war. Das ist ein klarer Fehlerr. Meine Schwester haben einen neuen Hund.</textarea>
  <p>
    <select id="lang"><option value="de-AT">Deutsch (Österreich)</option><option value="de-DE">Deutsch (Deutschland)</option></select>
    <button id="go" disabled>Prüfen</button>
  </p>
  <ol id="out"></ol>
  <script type="module">
    const worker = new Worker('./dist/worker.js', { type: 'module' });
    const $ = (id) => document.getElementById(id);
    let nextId = 0;
    worker.onmessage = ({ data }) => {
      if (data.ready) {
        $('status').textContent = `Bereit (Laden ${data.ms} ms).`;
        $('go').disabled = false;
        return;
      }
      $('go').disabled = false;
      if (data.error) { $('status').textContent = `Fehler: ${data.error}`; return; }
      const text = $('text').value;
      $('status').textContent = `${data.matches.length} Treffer in ${Math.round(performance.now() - started)} ms.`;
      $('out').replaceChildren(...data.matches.map((m) => {
        const li = document.createElement('li');
        const word = text.slice(m.offset, m.offset + m.length);
        const repl = m.replacements.slice(0, 3).map((r) => r.value).join(', ');
        li.innerHTML = `<code></code> → <b></b><br><small></small>`;
        li.querySelector('code').textContent = word;
        li.querySelector('b').textContent = repl || '–';
        li.querySelector('small').textContent = `${m.message} (${m.rule.id})`;
        return li;
      }));
    };
    let started = 0;
    $('go').onclick = () => {
      started = performance.now();
      $('go').disabled = true;
      $('status').textContent = 'Prüfe …';
      worker.postMessage({ id: nextId++, text: $('text').value, language: $('lang').value });
    };
  </script>
</body>
</html>
